<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login BPDAS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,128,0,0.5),rgba(0,128,0,0.5)),
    url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e');

    background-size:cover;
    background-position:center;
}

.login-box{

    width:350px;
    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:0 0 20px rgba(0,0,0,0.3);

    text-align:center;
}

.logo{
    width:90px;
    margin-bottom:10px;
}

h2{
    color:#1b5e20;
    margin-bottom:30px;
}

.input-box{

    width:100%;
    padding:12px;

    margin:10px 0;

    border:1px solid #ccc;

    border-radius:10px;

    font-size:16px;
}

button{

    width:100%;
    padding:12px;

    background:#1b5e20;

    color:white;

    border:none;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#2e7d32;
}

.footer{

    margin-top:15px;

    color:gray;

    font-size:13px;
}

</style>

</head>

<body>

<div class="login-box">

<img class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Logo_Kementerian_Lingkungan_Hidup_dan_Kehutanan.png/800px-Logo_Kementerian_Lingkungan_Hidup_dan_Kehutanan.png">

<h2>BPDAS BONE LIMBOTO</h2>

<input type="text"
id="username"
class="input-box"
placeholder="Username">

<input type="password"
id="password"
class="input-box"
placeholder="Password">

<button onclick="login()">LOGIN</button>

<div class="footer">
Sistem Produksi & Distribusi Bibit
</div>

</div>

<script>

function login(){

    let user =
    document.getElementById("username").value;

    let pass =
    document.getElementById("password").value;

    if(user=="persemaian" && pass=="bpdasbonelimboto"){

        window.location.href="dashboard.html";

    }else{

        alert("Username atau Password salah!");

    }
}

</script>

</body>
</html>
