<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPDAS Bone Limboto</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#dff5dc;
}

/* LOGIN */
#loginPage{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom,#2e7d32,#81c784);
}

.login-box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
    text-align:center;
}

.login-box h2{
    color:#2e7d32;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#2e7d32;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1b5e20;
}

/* DASHBOARD */
#dashboard{
    display:none;
    padding:20px;
}

.header{
    text-align:center;
    color:#1b5e20;
}

.card-container{
    display:flex;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    flex:1;
    min-width:200px;
    text-align:center;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
    background:white;
}

table th, table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

table th{
    background:#2e7d32;
    color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
    <div class="login-box">
        <h2>LOGIN ADMIN</h2>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p id="error" style="color:red;"></p>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

    <div class="header">
        <h1>BPDAS BONE LIMBOTO</h1>
        <h2>SISTEM PRODUKSI & DISTRIBUSI BIBIT</h2>
    </div>

    <div class="card-container">

        <div class="card">
            <h3>Total Produksi</h3>
            <h1>5000</h1>
        </div>

        <div class="card">
            <h3>Total Distribusi</h3>
            <h1>3000</h1>
        </div>

        <div class="card">
            <h3>Sisa Stok</h3>
            <h1>2000</h1>
        </div>

    </div>

    <table>
        <tr>
            <th>Bulan</th>
            <th>Produksi</th>
            <th>Distribusi</th>
            <th>Stok</th>
        </tr>

        <tr>
            <td>Januari</td>
            <td>1000</td>
            <td>500</td>
            <td>500</td>
        </tr>

        <tr>
            <td>Februari</td>
            <td>2000</td>
            <td>1000</td>
            <td>1000</td>
        </tr>

    </table>

</div>

<script>

function login(){

    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if(user === "admin" && pass === "12345"){

        document.getElementById("loginPage").style.display = "none";

        document.getElementById("dashboard").style.display = "block";

    }else{

        document.getElementById("error").innerHTML = "Username atau Password salah!";
    }
}

</script>

</body>
</html>
